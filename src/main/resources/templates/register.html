<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Opret bruger – Fog</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/register.css">
</head>
<body>

<div class="logo">Fog</div>

<div class="card">
    <h1>Opret bruger</h1>
    <p>Udfyld dine oplysninger for at oprette en konto</p>

    <div class="error" th:if="${errorMessage}" th:text="${errorMessage}"></div>
    <div class="success" th:if="${successMessage}" th:text="${successMessage}"></div>

    <form method="post" action="/register">

        <!-- Login s-->
        <div class="section-label">Login</div>
        <div class="field">
            <label for="email">Email <span style="color:#c0392b">*</span></label>
            <input type="email" id="email" name="email"
                   th:value="${prevEmail != null ? prevEmail : ''}"
                   placeholder="din@email.dk" required autofocus/>
        </div>
        <div class="field">
            <label for="password">Adgangskode <span style="color:#c0392b">*</span></label>
            <input type="password" id="password" name="password"
                   placeholder="Minimum 10 tegn" required/>
        </div>

        <hr class="divider"/>

        <!-- Contact info — pre-filled if they were filling out an order -->
        <div class="section-label">Kontaktoplysninger</div>
        <div class="field-row">
            <div class="field">
                <label for="firstName">Fornavn <span style="color:#c0392b">*</span></label>
                <input type="text" id="firstName" name="firstName"
                       th:value="${prevFirstName != null ? prevFirstName : ''}"
                       placeholder="Fornavn" required/>
            </div>
            <div class="field">
                <label for="lastName">Efternavn <span style="color:#c0392b">*</span></label>
                <input type="text" id="lastName" name="lastName"
                       th:value="${prevLastName != null ? prevLastName : ''}"
                       placeholder="Efternavn" required/>
            </div>
        </div>
        <div class="field">
            <label for="address">Adresse <span style="color:#c0392b">*</span></label>
            <input type="text" id="address" name="address"
                   th:value="${prevAddress != null ? prevAddress : ''}"
                   placeholder="Adresse" required/>
        </div>
        <div class="field-row">
            <div class="field">
                <label for="zipcode">Postnummer <span style="color:#c0392b">*</span></label>
                <input type="text" id="zipcode" name="zipcode"
                       th:value="${prevZipcode != null ? prevZipcode : ''}"
                       placeholder="2600" required/>
            </div>
            <div class="field">
                <label for="town">By <span style="color:#c0392b">*</span></label>
                <input type="text" id="town" name="town"
                       th:value="${prevTown != null ? prevTown : ''}"
                       placeholder="By" required/>
            </div>
        </div>
        <div class="field-row">
            <div class="field">
                <label for="phone">Telefon <span style="color:#c0392b">*</span></label>
                <input type="tel" id="phone" name="phone"
                       th:value="${prevPhone != null ? prevPhone : ''}"
                       placeholder="22 33 44 55" required/>
            </div>
        </div>

        <button class="btn" type="submit">Opret bruger</button>
    </form>

    <p class="login-link">
        Har du allerede en konto? <a href="/login">Log ind</a>
    </p>
</div>

</body>
</html>

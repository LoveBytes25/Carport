<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Log ind – Fog</title>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/login.css">
</head>
<body>

<div class="logo">Fog</div>

<div class="card">
    <h1>Log ind</h1>
    <p>Indtast dine oplysninger for at fortsætte</p>

    <div class="error" th:if="${errorMessage}" th:text="${errorMessage}"></div>

    <form method="post" action="/login">
        <div class="field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                   placeholder="din@email.dk" required autofocus/>
        </div>
        <div class="field">
            <label for="password">Adgangskode</label>
            <input type="password" id="password" name="password"
                   placeholder="••••••••" required/>
        </div>
        <button class="btn" type="submit">Log ind</button>
        <p style="text-align:center; margin-top:14px; font-size:13px; color:#888;">
            Har du ikke en konto?
            <a href="/register" style="color:#2a56a4; font-weight:600;">Opret bruger</a>
        </p>
    </form>
</div>

</body>
</html>
